# Source of truth for ios/ShinyTracker.xcodeproj — regenerate with `xcodegen generate` in ios/.
# The .xcodeproj, the generated Info.plist and the entitlements file are all gitignored: this
# file is the reviewable artifact.
name: ShinyTracker

options:
  bundleIdPrefix: com.casperkarlsen
  deploymentTarget:
    # iOS 26: the app is built around Liquid Glass and TabView's bottom accessory
    # (docs/superpowers/specs/2026-08-13-native-chrome-design.md). The codebase carries
    # zero availability guards precisely because the floor moves instead.
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ShinyTrackerKit:
    # Local, not remote — DECISIONS.md D2: its tests resolve shared/odds_anchors.json by walking
    # up from #filePath to the repo root, so it only works inside this monorepo.
    path: ShinyTrackerKit
  ShinyTrackerAuth:
    path: ShinyTrackerAuth
  ShinyTrackerAPI:
    path: ShinyTrackerAPI
  ShinyTrackerUI:
    # Design tokens transcribed from docs/design/hunt-prototype.dc.html. SwiftUI only —
    # no odds engine, no API client, no session.
    path: ShinyTrackerUI

targets:
  ShinyTracker:
    type: application
    platform: iOS
    sources:
      # App/Assets.xcassets and App/PrivacyInfo.xcprivacy are picked up by this recursive path;
      # the manifest needs `buildPhase: resources` spelled out because xcodegen does not know the
      # .xcprivacy extension and would otherwise drop it out of the bundle entirely.
      - path: App
        excludes: ["Config/**", "PrivacyInfo.xcprivacy"]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: App/Config/Secrets.xcconfig
      Release: App/Config/Secrets.xcconfig
    dependencies:
      - package: ShinyTrackerKit
      - package: ShinyTrackerAuth
      - package: ShinyTrackerAPI
      - package: ShinyTrackerUI
      # Embeds the Live Activity extension in the app bundle. Without this the widget builds
      # but never ships inside the app, and the activity silently fails to appear.
      - target: ShinyTrackerWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casperkarlsen.shinytracker
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPhone only. The design is a 390pt phone column throughout and iPad has never been
        # run, let alone laid out — "1,2" shipped a universal binary whose iPad half nobody
        # has ever seen. Widen it again when there is an iPad layout to widen it for.
        TARGETED_DEVICE_FAMILY: "1"
        # Without this the asset catalog compiles but no icon is assigned, and the upload is
        # rejected for a missing 1024×1024 marketing icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Sourced from Secrets.xcconfig (gitignored) rather than set here, so a personal
        # team id is never committed AND survives `xcodegen generate` — setting it in
        # Xcode's UI instead would be wiped on the next regeneration. Empty is fine for
        # simulator builds; a device build needs it filled in.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # Which entitlements file to apply, from Secrets.xcconfig. Set to the generated
        # App/ShinyTracker.entitlements for paid teams / release; set EMPTY on a free
        # personal team, which cannot provision Sign in with Apple. See the note by the
        # entitlements block below.
        CODE_SIGN_ENTITLEMENTS: $(ENTITLEMENTS_FILE)
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Populated from Secrets.xcconfig; read by AuthConfig.fromBundle().
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Read by APIConfig.fromBundle().
        API_BASE_URL: $(API_BASE_URL)
        # The app's only cryptography is HTTPS (URLSession) and the SHA-256 nonce hash for Sign
        # in with Apple — both exempt. Declaring it here is what stops App Store Connect asking
        # the export-compliance question on every single upload.
        ITSAppUsesNonExemptEncryption: false
        # Permits cleartext HTTP to loopback / .local / private-range addresses ONLY,
        # so the simulator can reach a Go API running on localhost:8080 before the
        # service is deployed. This is NOT NSAllowsArbitraryLoads — public hosts still
        # require HTTPS, so it is safe to ship and does not weaken the eventual
        # production configuration.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The OAuth redirect target. Must also be allow-listed in the Supabase project.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [shinytracker]
        # Without this the app may not request a Live Activity at all — ActivityKit reports
        # `.disabled` and `HuntListModel.syncActivity` quietly does nothing.
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The `~ipad` orientation list is gone with TARGETED_DEVICE_FAMILY: "1" — it described
        # a device the binary no longer installs on.
    # NO `entitlements:` block on purpose. xcodegen would write CODE_SIGN_ENTITLEMENTS
    # into the target, which overrides the settings block above and makes the entitlement
    # unconditional. Instead App/ShinyTracker.entitlements is a checked-in file, applied
    # only when ENTITLEMENTS_FILE points at it in Secrets.xcconfig.
    #
    # Why it has to be switchable: a FREE personal Apple team cannot provision
    # com.apple.developer.applesignin — Xcode fails with "Personal development teams ...
    # do not support the Sign In with Apple capability" — so local device testing needs it
    # off. Release builds on a paid team must have it ON: guideline 4.8 requires Sign in
    # with Apple because GitHub and Google sign-in are offered.

  # The Live Activity. A widget extension, because that is the only kind of bundle that may
  # declare an `ActivityConfiguration`.
  #
  # NOTE FOR A FREE PERSONAL TEAM: this is a second bundle identifier, so it needs its own
  # provisioning profile. Free teams are capped at a small number of app ids — if a device build
  # starts failing to provision after this, that cap is the first thing to check, not the code.
  ShinyTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      # Compiled into BOTH targets on purpose. The widget needs `HuntActivity` to declare the
      # activity and `LiveHuntCountIntent` to build its button; the app needs the same two types
      # to request the activity and to perform the intent. A shared local package would work too
      # and is three files of ceremony for one source file — the file is written to have no
      # app-only dependencies precisely so this stays legal.
      - path: App/Hunt/LiveHunt.swift
    configFiles:
      Debug: App/Config/Secrets.xcconfig
      Release: App/Config/Secrets.xcconfig
    dependencies:
      # The palette only. No API client and no session: everything this extension draws arrives
      # in the activity's `ContentState`, which is what keeps it off the network entirely.
      - package: ShinyTrackerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casperkarlsen.shinytracker.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Must match the host app's — an extension wider than its container fails validation.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # Deliberately NOT $(ENTITLEMENTS_FILE): that file is the *app's*, and it carries Sign in
        # with Apple, which an extension neither has nor may claim. This target needs none.
        CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ShinyTracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ShinyTracker:
    build:
      targets:
        ShinyTracker: all
    run:
      config: Debug
    archive:
      config: Release
